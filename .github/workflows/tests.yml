# Generated by `brew tap-new`, without the bottle upload: this tap ships no
# bottles, formulae build from source on install.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      # Also runs `brew trust` on this tap, which current Homebrew requires
      # before it loads a third-party formula.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # test-bot audits a changed formula with --strict only when it is new.
      # Formulae are named one by one: `brew audit --tap` and `--changed` skip
      # the RuboCop-based checks.
      - name: Strict audit of changed formulae
        if: github.event_name == 'pull_request'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          files="$(git diff --name-only --diff-filter=d origin/HEAD...HEAD -- 'Formula/*.rb')"
          for file in $files; do
            brew audit --strict --online --formula "${TAP_NAME}/$(basename "$file" .rb)"
          done

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'
